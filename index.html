<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00612C">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Painel comercial interno da CGLUB — acesso restrito à equipe.">
<title>Painel Comercial CGLUB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300843D'/%3E%3Crect y='25' width='32' height='7' fill='%23FFC72C'/%3E%3Ctext x='16' y='20' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ECG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="auth"><div class="boot"><span class="logo-fallback">CG<i></i></span><p>Carregando o Painel Comercial…</p><noscript>Ative o JavaScript para usar o painel.</noscript></div></div>

<div id="shell" class="shell" hidden>
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="Abrir menu"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="page-title"><h1 id="pgTitulo"></h1><p id="pgSub"></p></div>
      <div class="top-actions">
        <span id="syncStatus" class="sync on" title="">online</span>
        <button class="icon-btn" id="btnSync" aria-label="Atualizar dados do servidor" title="Atualizar dados"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 01-15.5 6.2L3 16M3 12a9 9 0 0115.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/></svg></button>
        <label class="sel-mes"><span class="sr">Mês</span><select id="selMes" aria-label="Mês de referência"></select></label>
        <label class="switch" id="remessaWrap" title="Notas com condição 'SIMPLES REMESSA' não são venda: ficam fora dos indicadores quando marcado">
          <input type="checkbox" id="excluirRemessa" checked><span>Excluir Simples Remessa</span>
        </label>
        <button class="btn" id="btnImportar"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><span>Importar SAP</span></button>
        <button class="icon-btn" id="btnTema" aria-label="Alternar tema claro/escuro"><svg class="ico-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
</div>
<input type="file" id="fileSap" accept=".xlsx,.xls,.csv" hidden>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <button class="icon-btn close" id="drawerClose" aria-label="Fechar">✕</button>
    <div id="drawerBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/carteira.js"></script>
<script src="js/api.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/views-painel.js"></script>
<script src="js/views-campo.js"></script>
<script src="js/views-admin.js"></script>
<script src="js/views-gestor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
